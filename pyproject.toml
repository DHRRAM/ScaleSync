[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scalesync"
version = "0.2.0"
description = "Cross-DCC asset scale normalization for Maya, Blender, and Houdini workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Dhruv Ram" }]
keywords = ["maya", "blender", "houdini", "pipeline", "usd", "fbx", "scale", "dcc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
scalesync = "scalesync.cli:main"
scalesync-install-maya = "scalesync.tools.installers:install_maya_module_cli"
scalesync-install-blender = "scalesync.tools.installers:install_blender_addon_cli"
scalesync-build-blender = "scalesync.tools.blender_extension:main"
scalesync-build-distributions = "scalesync.tools.distributions:main"
scalesync-install-houdini = "scalesync.tools.installers:install_houdini_package_cli"
scalesync-houdini-build-hda = "scalesync.houdini.hda_builder:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["scalesync*"]

[tool.setuptools.package-data]
scalesync = ["default_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
